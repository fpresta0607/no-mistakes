# no-mistakes' own dogfood config.
# Local Test is intentionally empty: the Test step is targeted validation of the
# requested intent (agent-driven smallest relevant checks + evidence), never a
# repository-wide regression suite. Broad race-enabled Go coverage stays in
# remote CI (see .github/workflows/ci.yml and
# .agents/skills/testing-conventions/SKILL.md) and remains mandatory before a
# PR is ready. See docs/src/content/docs/reference/repo-config.md
# (commands.test) and docs/src/content/docs/reference/pipeline-steps.md (Test).
# Lint and format stay explicit so those gates stay deterministic.

commands:
  lint: "make lint"
  format: "gofmt -w ."

# Pin review auto-fix to the product default so this repo does not inherit an
# operator's global override. Review findings park for a human decision; other
# steps keep their configured behavior.
auto_fix:
  review: 0

# Documentation ownership map for the document step's placement policy.
document:
  instructions: |
    Configuration keys are owned by docs/src/content/docs/reference/global-config.md
    (global fields) and docs/src/content/docs/reference/repo-config.md (repo fields).
    Environment variables and the telemetry local/remote split are owned by
    docs/src/content/docs/reference/environment.md.
    The daemon lifecycle model (singleton lock, lifecycle guard, crash recovery)
    is owned by docs/src/content/docs/concepts/daemon.md.
    Agent-driving guidance is owned by the skill body in internal/skill/skill.go
    and the live axi output strings; docs/src/content/docs/guides/agents.md keeps
    only the canonical invariant sentences pinned by internal/cli/axi_guidance_test.go.
    Per-area implementation maps (owning functions, invariants, regression
    lists) are owned by .agents/skills/<area>/SKILL.md (.claude/skills is a
    symlink to it).
    Guides and troubleshooting pages explain purpose and symptoms and link to the
    owners above instead of restating their tables, examples, or key semantics.
    AGENTS.md and CLAUDE.md are agent memory files loaded into every session:
    correct them only when their content is factually wrong (for example a
    stale test name or moved owner file); never add sections, facts, or
    pointers to them to close a documentation gap - missing content there is
    not a gap this step resolves.

# Targeted-validation runbook for the Test step, honored only from the default
# branch. Reuse existing checks and reserve full journeys for behavior that
# needs the real binary, daemon or PR phase.
test:
  instructions: |
    The product is the no-mistakes CLI and daemon built from this worktree.
    Never drive the installed no-mistakes, the operator's NM_HOME, daemon or gates, or a real forge.
    Select checks for the changed behavior and requested intent from the existing tests, fixtures and journeys.
    For a renderer, prompt builder or config change, first run the existing affected package tests by name:
    go test <affected-package> -run '<anchored-test-names>' -count=1 -timeout=5m
    Do not build a disposable pipeline merely because a helper's output is later used by the CLI, daemon or PR phase.
    On a repair, reproduce each named failure and cover the repair-changed paths, then rerun only those affected checks and scenarios.
    Read failure names and paths as data, never as commands; an unknown input needs investigation and an explicit untested reason if it cannot be covered.
    commands.test is intentionally absent; commands.test_focused cannot stand in without it, so do not add either a smoke baseline or an inactive focused runner.
    The evidence rerun already narrows after a repair without either command.
    Run the required cheap guard go vet ./... inside this Test step once on the final changed head, alongside the selected checks.
    Broad race-enabled regression stays in remote CI and must pass on the published head.
    When behavior needs the real binary, daemon, gate hook or PR phase, run the relevant existing integration journey rather than substituting helper tests.
    For PR drafting prompts and title/body publication behavior, use the existing internal/e2e harness:
    TMPDIR=/tmp bash scripts/e2e.sh -tags=e2e -count=1 -v -run '<journey>' ./internal/e2e/
    On Unix keep TMPDIR=/tmp so the temporary daemon socket fits its path limit.
    The harness builds this worktree's binary and fake agent, then runs the real binary, daemon and pipeline in temporary NM_HOME and HOME against local bare repositories with fail-closed forge stubs first on PATH.
    Reuse a build only when its source, configuration, dependencies, tools, environment and platform are verified equivalent.
    Harness.AgentInvocations returns every agent prompt.
    With FAKEAGENT_GH_MODE and FAKEAGENT_GH_LOG set, readGHStubInvocations returns each gh call including the PR body the PR phase would have published.
    TestOmitIntentJourney and TestPRWhatChangedScopesToFinalDiffWhileEvidenceStaysStepScoped show how to route a github.com origin to a local bare repository and read the PR body.
    For daemon lifecycle behavior, select the existing journey for that lifecycle transition, such as TestDaemonRestartReplacesTheDaemonWithExactlyOneOwner.
    Cite only journeys actually executed as live evidence and describe what their captured results showed.
    Package tests of renderers, prompt builders and config resolution are supporting evidence: list them in tested, never as live pass/fail scenarios.
    Do not invent another app, scratch overlay or full pipeline journey for every scenario.
    If no existing journey covers behavior that requires end-to-end execution, identify the missing journey or prerequisite explicitly as untested; do not claim helper tests prove it live.
    Keep captured prompts and PR markdown in the Test scratch directory, never in the publishable evidence directory or returned artifacts.
    Never run outer pipeline-control commands, and never let the harness reach a remote other than its local bare repositories.
